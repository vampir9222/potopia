<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- Pavillon des pirates au chapeau de paille (thème One Piece), dessiné à la main. -->
  <rect width="300" height="200" fill="#0b0b0d"/>
  <rect width="300" height="200" fill="none" stroke="#1d1d22" stroke-width="6"/>
  <!-- os croisés -->
  <g fill="#f4efe2">
    <g transform="rotate(32 150 112)">
      <rect x="62" y="104" width="176" height="16" rx="8"/>
      <circle cx="62" cy="103" r="11"/><circle cx="62" cy="121" r="11"/>
      <circle cx="238" cy="103" r="11"/><circle cx="238" cy="121" r="11"/>
    </g>
    <g transform="rotate(-32 150 112)">
      <rect x="62" y="104" width="176" height="16" rx="8"/>
      <circle cx="62" cy="103" r="11"/><circle cx="62" cy="121" r="11"/>
      <circle cx="238" cy="103" r="11"/><circle cx="238" cy="121" r="11"/>
    </g>
  </g>
  <!-- crâne -->
  <g fill="#f4efe2">
    <circle cx="150" cy="96" r="44"/>
    <rect x="124" y="112" width="52" height="40" rx="14"/>
  </g>
  <g fill="#0b0b0d">
    <ellipse cx="132" cy="100" rx="11" ry="13"/>
    <ellipse cx="168" cy="100" rx="11" ry="13"/>
    <path d="M150 112 l-6 12 h12 z"/>
    <path d="M128 136 q22 10 44 0" fill="none" stroke="#0b0b0d" stroke-width="3" stroke-linecap="round"/>
    <rect x="137.5" y="133" width="2.5" height="12" rx="1"/>
    <rect x="148.8" y="135" width="2.5" height="12" rx="1"/>
    <rect x="160" y="133" width="2.5" height="12" rx="1"/>
  </g>
  <!-- chapeau de paille : calotte, ruban rouge, bord -->
  <path d="M112 70 C112 38 188 38 188 70 Z" fill="#f2c23a" stroke="#a87512" stroke-width="2.5"/>
  <path d="M112.6 60 C130 64 170 64 187.4 60 L188 70 L112 70 Z" fill="#d8342b"/>
  <ellipse cx="150" cy="72" rx="74" ry="11" fill="#f2c23a" stroke="#a87512" stroke-width="2.5"/>
  <path d="M86 72 q64 7 128 0" fill="none" stroke="#c9961f" stroke-width="2"/>
  <path d="M126 46 q24 -8 48 0" fill="none" stroke="#fff3b8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
